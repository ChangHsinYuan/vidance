<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidance — AI 视频生成 Agent</title>
<style>
  :root {
    --bg: #0f0f1a; --bg2: #1a1a2e; --bg3: #232342;
    --fg: #e8e8f0; --fg-dim: #8a8a9e;
    --accent: #6c7bff; --accent2: #8b5cf6;
    --ok: #34d399; --warn: #fbbf24; --err: #ef4444;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; overflow: hidden;
  }
  #app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }

  /* ── 顶部栏 ── */
  #topbar {
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: var(--bg2); border-bottom: 1px solid #2a2a45;
  }
  #topbar .brand { font-weight: 700; font-size: 16px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #topbar .title { color: var(--fg-dim); font-size: 13px; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #btn-new {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  #btn-new:hover { opacity: .85; }
  #btn-menu { display: none; background: none; border: none; color: var(--fg); font-size: 20px; cursor: pointer; }

  /* ── 主体三栏 ── */
  #main { display: grid; grid-template-columns: 240px 1fr; overflow: hidden; }

  /* 左侧边栏 */
  #sidebar {
    background: var(--bg2); border-right: 1px solid #2a2a45;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar section { padding: 12px; border-bottom: 1px solid #2a2a45; }
  #sidebar h3 { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .task-item {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: 12px;
  }
  .task-item:hover { background: var(--bg3); }
  .task-item .t-status { float: right; font-size: 11px; }
  .st-queued { color: var(--warn); } .st-running { color: var(--accent); }
  .st-completed { color: var(--ok); } .st-failed { color: var(--err); }

  /* 画布区（顶部大片留白 + 消息流） */
  #canvas { display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #messages { flex: 1; overflow-y: auto; padding: 32px 24px 12px; }
  .empty-hint { text-align: center; color: var(--fg-dim); margin-top: 18vh; }
  .empty-hint h1 { font-size: 28px; margin-bottom: 12px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .empty-hint p { font-size: 14px; margin-bottom: 4px; }
  .empty-hint code { background: var(--bg3); padding: 2px 8px; border-radius: 6px; color: var(--accent); }

  .msg { max-width: 78%; margin-bottom: 16px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { margin-left: auto; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 16px 16px 4px 16px; }
  .msg.bot { background: var(--bg2); padding: 12px 14px; border-radius: 16px 16px 16px 4px; border: 1px solid #2a2a45; }
  .msg.bot b { color: var(--accent); }

  .card {
    background: var(--bg2); border: 1px solid #2a2a45; border-radius: var(--radius);
    padding: 14px; margin: 0 auto 16px; max-width: 640px; width: 90%;
  }
  .card h4 { font-size: 13px; color: var(--fg-dim); margin-bottom: 8px; }
  .card .concept { font-size: 14px; margin-bottom: 10px; }
  .progress-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width .5s; }
  .card .meta { font-size: 12px; color: var(--fg-dim); }
  .vuni { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 320px; background: #000; }
  #task-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 0; flex: none; }
  .stream-log { font-size: 12.5px; line-height: 1.9; }
  .stream-log .args { color: var(--fg-dim); font-size: 11px; margin-left: 6px; word-break: break-all; }
  .stream-log .tm { color: var(--fg-dim); font-size: 11px; margin-left: 6px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--fg-dim); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .stream-log .live { color: var(--fg-dim); font-size: 12px; margin-bottom: 4px; }
  .stream-log .llmt { color: var(--fg-dim); font-size: 11px; font-family: ui-monospace,monospace; max-height: 96px; overflow: hidden; white-space: pre-wrap; word-break: break-all; margin-top: 4px; border-top: 1px dashed rgba(255,255,255,.1); padding-top: 4px; }
  .pipe-bar { position: sticky; top: -10px; display: flex; gap: 5px; flex-wrap: wrap; padding: 6px 2px; margin-bottom: 4px; background: var(--bg, rgba(10,12,20,.96)); z-index: 3; border-bottom: 1px solid rgba(255,255,255,.07); }
  .pnode { font-size: 10.5px; padding: 3px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14); color: var(--fg-dim); background: rgba(255,255,255,.04); display: inline-flex; align-items: center; gap: 5px; }
  .pnode.d0 { background: rgba(139,124,246,.10); border-color: rgba(139,124,246,.25); }
  .pnode.d1 { background: rgba(246,163,92,.10); border-color: rgba(246,163,92,.25); }
  .pnode.d2 { background: rgba(92,200,246,.10); border-color: rgba(92,200,246,.25); }
  .pnode.d3 { background: rgba(99,230,166,.10); border-color: rgba(99,230,166,.25); }
  .pnode.d4 { background: rgba(246,108,139,.10); border-color: rgba(246,108,139,.25); }
  .pnode.run { color: var(--fg); box-shadow: 0 0 7px rgba(108,123,255,.45); }
  .pnode.run.d0 { box-shadow: 0 0 7px rgba(139,124,246,.55); }
  .pnode.run.d1 { box-shadow: 0 0 7px rgba(246,163,92,.55); }
  .pnode.run.d2 { box-shadow: 0 0 7px rgba(92,200,246,.55); }
  .pnode.run.d3 { box-shadow: 0 0 7px rgba(99,230,166,.55); }
  .pnode.run.d4 { box-shadow: 0 0 7px rgba(246,108,139,.55); }
  .pnode.run::before { content: ''; width: 7px; height: 7px; border-radius: 50%; flex: none;
    border: 1.5px dashed currentColor; animation: rot .8s linear infinite; }
  .pnode.ok { color: var(--ok); border-color: rgba(74,222,128,.55); background: rgba(74,222,128,.08); box-shadow: 0 0 6px rgba(74,222,128,.4); }
  .pnode.fail { color: #e5534b; border-color: rgba(229,83,75,.55); }
  .ans { margin: 3px 0 3px 20px; border-left: 2px solid rgba(108,123,255,.35); padding-left: 8px; }
  .ans summary { cursor: pointer; color: var(--accent); font-size: 11.5px; user-select: none; }
  .ans .ans-b { font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; margin-top: 3px; }
  #log-tabs { display: flex; gap: 4px; padding: 4px 8px; }
  .ltab { font-size: 11px; padding: 1px 8px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: var(--fg-dim); border-radius: 8px; cursor: pointer; }
  .ltab.on { color: var(--accent); border-color: var(--accent); }
  #task-tabs:empty { display: none; }
  .ttab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 12px;
    background: var(--bg3, #1b2330); border: 1px solid var(--border, #2d3a4f); border-radius: 8px 8px 0 0;
    cursor: pointer; white-space: nowrap; color: var(--fg, #dfe4ee); }
  .ttab:hover { border-color: var(--accent); }
  .ttab b { color: var(--fg-dim); font-weight: 400; padding: 0 2px; }
  .ttab b:hover { color: var(--err, #f66); }
  .tdot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex: none; }
  .tdot.running { background: var(--accent); animation: blink 1s infinite alternate; }
  .tdot.completed { background: var(--ok); } .tdot.failed { background: #f66; }
  @keyframes blink { from { opacity: 1; } to { opacity: .3; } }
  #task-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: flex-start; justify-content: center; z-index: 90; overflow-y: auto; padding: 40px 16px; }
  #task-overlay .ov-box { background: var(--bg2, #141b26); border: 1px solid var(--border, #2d3a4f);
    border-radius: 12px; max-width: 760px; width: 100%; padding: 18px 20px; }
  #task-overlay .ov-log { background: #0a0e14; color: #9fd6a8; font-size: 11px; white-space: pre-wrap;
    max-height: 260px; overflow-y: auto; padding: 10px; border-radius: 8px; margin-top: 10px; }
  .card video { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 320px; background: #000; }
  .card .cand, .msg.bot .cand { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font-size: 13px; }
  .msg.bot .img-prev { max-width: 100%; max-height: 320px; border-radius: 8px; margin-top: 6px; display: block; }
  .card .score, .msg.bot .score { color: var(--ok); font-weight: 700; min-width: 24px; }
  .kv { display: flex; gap: 8px; padding: 2px 0; font-size: 13px; }
  .kv .k { color: var(--fg-dim); min-width: 44px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; margin-right: 6px; }
  .pill.running { background: #2a2a55; color: var(--accent); }
  .pill.completed { background: #1a3a2e; color: var(--ok); }
  .pill.failed { background: #3a1a1a; color: var(--err); }
  .pill.queued { background: #3a301a; color: var(--warn); }
  .chip-btn {
    display: inline-block; margin: 6px 6px 0 0; padding: 6px 12px; font-size: 12px;
    background: var(--bg3); color: var(--accent); border: 1px solid #3a3a60;
    border-radius: 16px; cursor: pointer;
  }
  .chip-btn:hover { background: #2e2e55; }

  /* 右下发框 */
  #composer { padding: 12px 24px 20px; background: var(--bg); }
  #composer-inner { max-width: 720px; margin: 0 auto; position: relative; }
  #input-row {
    display: flex; gap: 8px; background: var(--bg2); border: 1px solid #32325a;
    border-radius: 14px; padding: 10px 12px; align-items: flex-end;
  }
  #input-row:focus-within { border-color: var(--accent); }
  #msg-input {
    flex: 1; background: none; border: none; outline: none; color: var(--fg);
    font-size: 14px; resize: none; max-height: 120px; line-height: 1.5; font-family: inherit;
  }
  #btn-send {
    background: var(--accent); border: none; color: #fff; border-radius: 10px;
    width: 38px; height: 34px; font-size: 15px; cursor: pointer; flex-shrink: 0;
  }
  #btn-send:disabled { opacity: .4; cursor: default; }
  #composer .hint { text-align: center; font-size: 11px; color: var(--fg-dim); margin-top: 6px; }

  /* / 命令补全弹层 */
  #slash-pop {
    position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px;
    background: var(--bg2); border: 1px solid #32325a; border-radius: 12px;
    max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 -8px 24px rgba(0,0,0,.5);
  }
  #slash-pop.show { display: block; }
  .slash-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #232342; }
  .slash-item:hover, .slash-item.active { background: var(--bg3); }
  .slash-item code { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .slash-item .d { font-size: 12px; color: var(--fg-dim); }
  /* arch + agent trace */
  .arch-flow { font-size: 12px; color: var(--fg-dim); margin: 6px 0 2px; }
  .arch-svcs { margin: 6px 0 4px; }
  .svc { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family: monospace;
         border: 1px solid #2c2c4a; border-radius: 12px; padding: 1px 9px; margin: 2px 5px 0 0; color: var(--fg-dim); }
  .svc i { width: 7px; height: 7px; border-radius: 50%; background: #555; display: inline-block; }
  .svc.on i { background: #3ddc84; box-shadow: 0 0 5px #3ddc84; }
  .svc.on { color: #cfd3ea; }
  .arch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 10px 0 6px; }
  .arch-L { border: 1px solid; border-radius: 8px; padding: 9px 11px; background: var(--bg3); }
  .arch-h { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
  .arch-p { font-weight: 400; font-size: 11px; color: var(--fg-dim); margin-left: 6px; font-family: monospace; }
  .arch-n { font-size: 11px; color: var(--fg-dim); margin-bottom: 6px; }
  .arch-L .ag { display: inline-block; font-size: 11px; background: #232342; border-radius: 10px; padding: 1px 8px; margin: 2px 3px 0 0; color: #cfd3ea; }
  .arch-t { margin-top: 5px; }
  .arch-L .tl { display: inline-block; font-size: 10px; color: var(--fg-dim); border: 1px solid #2c2c4a; border-radius: 3px; padding: 0 5px; margin: 2px 3px 0 0; font-family: monospace; }
  .arch-sub { font-size: 11px; color: var(--fg-dim); margin-left: 8px; }
  .arch-note { font-size: 11px; color: var(--fg-dim); margin-top: 4px; }
  .trace-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed #232342; }
  .trace-row:last-child { border-bottom: none; }
  .trace-badge { font-family: monospace; font-size: 10px; border-radius: 3px; padding: 0 6px; border: 1px solid #2c2c4a; color: #9aa0c8; flex-shrink: 0; }
  .trace-agg { white-space: nowrap; font-weight: 600; font-size: 12px; }
  .trace-agg.ok { color: var(--ok); } .trace-agg.err { color: var(--err); }
  .trace-score { color: #f6c85c; } .trace-dur { color: var(--fg-dim); margin-left: auto; font-size: 11px; flex-shrink: 0; }
  .trace-err { color: var(--err); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 模型设置弹层 */
  #model-modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.6); align-items: center; justify-content: center;
  }
  #model-modal.show { display: flex; }
  #model-modal .modal-box {
    background: var(--bg2); border: 1px solid #32325a; border-radius: var(--radius);
    padding: 24px; width: 560px; max-width: 95vw; max-height: 85vh; overflow-y: auto;
  }
  #model-modal h3 { font-size: 15px; margin-bottom: 16px; color: var(--fg); }
  #model-modal h4 { font-size: 13px; color: var(--fg-dim); margin: 16px 0 8px; }
  #model-modal .section { margin-bottom: 16px; }
  #model-modal .field { margin-bottom: 10px; }
  #model-modal .field label { display: block; font-size: 11px; color: var(--fg-dim); margin-bottom: 3px; }
  #model-modal input, #model-modal select {
    width: 100%; background: var(--bg); color: var(--fg); border: 1px solid #32325a;
    border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  #model-modal input:focus, #model-modal select:focus { border-color: var(--accent); }
  #model-modal .task-assign {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    padding: 8px; background: var(--bg3); border-radius: 8px;
  }
  #model-modal .task-assign .tt-label { font-size: 12px; color: var(--fg-dim); min-width: 70px; }
  #model-modal .task-assign select { flex: 1; padding: 5px 8px; font-size: 12px; }
  #model-modal .prov-card {
    padding: 10px; background: var(--bg3); border-radius: 8px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #model-modal .prov-card .prov-info { flex: 1; }
  #model-modal .prov-card .prov-name { font-size: 13px; color: var(--fg); }
  #model-modal .prov-card .prov-meta { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  #model-modal .prov-card .prov-models { font-size: 11px; color: var(--accent); margin-top: 2px; }
  #model-modal .prov-actions { display: flex; gap: 4px; }
  #model-modal .prov-actions button {
    background: none; border: 1px solid #32325a; color: var(--fg-dim); border-radius: 6px;
    padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  #model-modal .prov-actions button:hover { color: var(--fg); border-color: var(--accent); }
  #model-modal .prov-actions button.danger:hover { color: var(--err); border-color: var(--err); }
  #model-modal .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  #model-modal .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  #model-modal .btn-secondary {
    background: var(--bg3); color: var(--fg); border: 1px solid #32325a; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  #model-modal .btn-sm {
    padding: 5px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none;
  }
  #model-modal .add-form { display: none; padding: 12px; background: var(--bg); border-radius: 8px; margin-top: 8px; }
  #model-modal .add-form.show { display: block; }
  #model-modal .model-list { max-height: 150px; overflow-y: auto; margin-top: 6px; }
  #model-modal .model-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px;
  }
  #model-modal .model-item input[type=checkbox] { width: auto; }
  #model-modal .model-item .caps { display: flex; gap: 4px; margin-left: auto; }
  #model-modal .model-item .caps select { width: auto; padding: 2px 6px; font-size: 11px; }
  #model-modal .discover-status { font-size: 11px; color: var(--fg-dim); margin-top: 4px; }
  #btn-settings {
    background: none; border: none; color: var(--fg-dim); font-size: 18px; cursor: pointer;
    padding: 4px 8px;
  }
  #btn-settings:hover { color: var(--fg); }
  #btn-comfyui:hover { color: var(--fg); }
  #btn-log {
    background: none; border: none; color: var(--fg-dim); font-size: 16px; cursor: pointer;
    padding: 4px 8px;
  }
  #btn-log:hover, #btn-log.on { color: var(--accent); }

  /* 可折叠日志面板（底部抽屉） */
  #log-panel {
    position: fixed; left: 0; right: 0; bottom: 0; height: 40vh; max-height: 420px;
    background: #0d0d1a; border-top: 1px solid #2a2a4a; z-index: 80;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .22s ease;
    box-shadow: 0 -8px 24px rgba(0,0,0,.5);
  }
  #log-panel.open { transform: translateY(0); }
  #log-head {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid #232342; font-size: 13px; color: var(--fg-dim);
  }
  #log-head .log-task { color: var(--accent); font-family: monospace; }
  #log-head .log-auto { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12px; }
  #log-head .log-auto input { width: auto; }
  #log-head .log-x {
    background: none; border: none; color: var(--fg-dim); cursor: pointer; font-size: 14px;
  }
  #log-head .log-x:hover { color: var(--err); }
  #log-body {
    flex: 1; overflow-y: auto; margin: 0; padding: 10px 14px;
    font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; line-height: 1.5;
    color: #b8c1d9; white-space: pre-wrap; word-break: break-all;
  }

  /* 窄屏响应式 */
  @media (max-width: 768px) {
    #main { grid-template-columns: 1fr; }
    #sidebar { position: fixed; left: -260px; top: 52px; bottom: 0; width: 240px; z-index: 50; transition: left .25s; }
    #sidebar.open { left: 0; }
    #btn-menu { display: block; }
    .msg, .card { max-width: 95%; }
  }
.ins-lib{margin-top:8px;max-height:340px;overflow:auto;font-size:12px;line-height:1.7;
  border-left:2px solid #444;padding-left:10px}
.ins-line{white-space:pre-wrap;word-break:break-word;color:#cfcfcf}
.ins-line:nth-child(odd){background:rgba(255,255,255,.02)}
.cmd-row{cursor:pointer;padding:2px 0}
.cmd-row:hover{background:rgba(80,160,255,.12)}
.cmd-row code{color:#6cf;font-weight:600}
.cmd-brief{color:#cfcfcf}
.ins-sec{margin:8px 0 2px;font-weight:600;color:#9ad}
.ins-hint{color:#8a8;font-size:12px;margin-bottom:6px}
.ver{color:#888;font-size:11px}
.req{color:#e66;font-size:11px}
.ch{color:#7a7;font-size:11px}
.ins-line code{color:#6cf}
.t2c-cmd{display:block;padding:8px 10px;margin:6px 0;background:#1b2330;border:1px solid #2d4a6b;
  border-radius:6px;color:#7fd;white-space:pre-wrap;word-break:break-all;font-size:12px}
.t2c-src{color:#888;font-size:11px;margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="btn-menu" onclick="toggleSidebar()">☰</button>
    <span class="brand">Vidance</span><span id="ui-ver" style="font-size:10px;color:var(--fg-dim)">v13.3.2</span>
    <span id="llm-dot" title="LLM 服务状态" style="width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-left:8px;flex-shrink:0;"></span>
    <span class="title" id="session-title">新会话</span>
    <button id="btn-comfyui" onclick="openComfyUI()" title="ComfyUI 节点画布" style="background:none;border:none;color:var(--fg-dim);font-size:14px;cursor:pointer;padding:4px 8px;">🎨</button>

    <button id="btn-settings" onclick="openModelModal()" title="模型设置">⚙</button>
    <button id="btn-new" onclick="newChat()">＋ 新建</button>
  </div>
  <div id="main">
    <div id="sidebar">
      <section style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <h3>历史 <span onclick="clearChats()" title="清空浏览器会话（output 记录不受影响）" style="float:right;font-size:10px;color:var(--fg-dim);cursor:pointer;padding:0 6px">清空</span></h3>
        <div id="chat-list" style="flex:1;overflow-y:auto;"></div>
      </section>
    </div>
    <div id="canvas">
      <div id="task-tabs"></div>
      <div id="messages">
        <div class="empty-hint" id="empty-hint">
          <h1>Vidance</h1>
    <p>一句话生成有声短片。直接输入概念，或用 <code>/fast</code> <code>/edit</code> <code>/vace</code> 等命令</p>
          <p>输入 <code>/</code> 查看全部命令</p>
        </div>
      </div>
      <div id="composer">
        <div id="composer-inner">
          <div id="slash-pop"></div>
          <div id="input-row">
            <textarea id="msg-input" rows="1" placeholder="输入概念或 / 命令…（回车发送）"></textarea>
            <button id="btn-send" onclick="send()">↑</button>
          </div>
          <div class="hint">/fast 秒级出片 · /hot 热点一步到位 · /edit 图片编辑 · /vace 参考图生视频 · /auto 完整流水线</div>
        </div>
      </div>
    </div>
  </div>
  <div id="log-panel">
    <div id="log-head">
      <span>📋 详细日志</span>
      <span id="log-task" class="log-task">—</span>
      <label class="log-auto"><input type="checkbox" id="log-follow" checked> 自动滚动</label>
      <button class="log-x" onclick="toggleLog()">✕</button>
    </div>
    <div id="log-tabs">
      <button class="ltab on" data-src="task" onclick="logSrc('task')">台账</button>
      <button class="ltab" data-src="wan" onclick="logSrc('wan')">wan</button>
      <button class="ltab" data-src="flux" onclick="logSrc('flux')">flux</button>
      <button class="ltab" data-src="tts" onclick="logSrc('tts')">tts</button>
      <button class="ltab" data-src="api" onclick="logSrc('api')">api</button>
      <button class="ltab" data-src="h3" onclick="logSrc('h3')">h3</button>
    </div>
    <pre id="log-body">（运行任务后，这里显示实时日志）</pre>
  </div>
  <div id="model-modal">
    <div class="modal-box">
      <h3>模型提供商</h3>
      <div class="section">
        <h4>任务分配</h4>
        <div id="ta***REMOVED***"></div><div id="switch-status" style="font-size:11px;color:#e5534b;margin:2px 2px 6px"></div>
      </div>
      <div class="section">
        <h4>已配置提供商</h4>
        <div id="provider-list"></div>
        <div style="display:flex;gap:6px;margin-top:8px"><button class="btn-secondary btn-sm" style="flex:1" onclick="probeProviders()">连通性探测</button><button class="btn-secondary btn-sm" style="flex:1" onclick="testChatRotate()">测试故障切换</button></div><div id="chat-rotate-status" style="font-size:11px;color:var(--fg-dim);margin-top:4px"></div><div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn-secondary btn-sm" style="flex:1" onclick="importFromConfig()">⤓ 从本地 config 一键导入</button>
        <button class="btn-secondary btn-sm" onclick="$('#import-cfg-box').style.display='block'" style="flex:none">粘贴他机 config…</button></div>
        <div id="import-cfg-box" style="display:none;margin-top:6px">
          <textarea id="import-cfg-text" rows="5" style="width:100%;font-size:11px" placeholder="粘贴对方 config.json 全文（含 model_providers / llm 段）"></textarea>
          <label style="font-size:11px;color:var(--fg-dim)"><input type="checkbox" id="import-overwrite-llm"> 同时覆盖本机上网关(base_url/key/models)</label>
          <button class="btn-primary btn-sm" onclick="importFromConfig(true)">导入</button></div>
        <div id="import-cfg-status" style="font-size:11px;color:var(--fg-dim);margin-top:4px"></div>
        <button class="btn-secondary" onclick="toggleAddForm()" style="margin-top:8px;width:100%;">＋ 添加提供商</button>
        <div id="add-form" class="add-form">
          <div class="field"><label>名称</label><input id="af-name" placeholder="例：我的 Replicate"></div>
          <div class="field"><label>API 地址</label><input id="af-url" placeholder="https://api.example.com/v1"></div>
          <div class="field"><label>API Key</label><input id="af-key" type="password" placeholder="sk-..."></div>
          <div class="btn-row">
            <button class="btn-secondary btn-sm" onclick="discoverModels()">查询模型</button>
            <span id="discover-status" class="discover-status"></span>
          </div>
          <div id="discovered-models" class="model-list"></div>
          <div class="btn-row" style="justify-content:flex-end;margin-top:12px;">
            <button class="btn-secondary btn-sm" onclick="toggleAddForm()">取消</button>
            <button class="btn-primary btn-sm" onclick="submitAddProvider()">添加</button>
          </div>
        </div>
      </div>
      <div style="text-align:right;margin-top:16px;">
        <button class="btn-secondary" onclick="closeModelModal()">关闭</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const messages = $('#messages'), input = $('#msg-input'), pop = $('#slash-pop');

let TOOLS = [];               // /api/tools
let TOOLS_LOADED = false;
let activeDialog = null;      // v6 dialog {dialog_id, status, ...}（自然语言对话中）
let pollers = {};             // task_id → interval
let logTaskId = null;         // 日志面板当前跟踪的任务
let logTimer = null;          // 日志轮询 interval
const pollInterval = 2000;

/* ── 初始化 ── */
async function init() {
  try {
    const r = await fetch('/api/tools');
    const d = await r.json();
    TOOLS = d.tools || [];
  } catch (e) { TOOLS = []; }
  TOOLS_LOADED = true;
  refreshTasks();
  setInterval(refreshTasks, 10000);
  pollLlmHealth(); setInterval(pollLlmHealth, 30000);
  input.focus();
}

async function pollLlmHealth() {
  const dot = $('#llm-dot');
  if (!dot) return;
  try {
    const d = await (await fetch('/api/health')).json();
    const llm = d.llm || {};
    if (llm.ok === true) {
      dot.style.background = '#4caf50';
      dot.title = `LLM 正常 (${llm.latency_ms ?? '?'}ms${llm.cached ? ' 缓存' : ''})`;
    } else if (llm.ok === false) {
      dot.style.background = '#e53935';
      dot.title = 'LLM 服务不可达';
    } else {
      dot.style.background = '#555';
      dot.title = 'LLM 状态未知（旧版 API）';
    }
  } catch (e) {
    dot.style.background = '#e53935';
    dot.title = 'API 服务不可达';
  }
}

/* ── 左栏任务列表 ── */
async function refreshTasks() {
  try {
    const r = await fetch('/api/tasks?limit=30');
    const d = await r.json();
    renderChatSide();
    const el = $('#task-list'); if (!el) return;
    if (!d.tasks || !d.tasks.length) {
      el.innerHTML = '<div style="color:var(--fg-dim);font-size:12px;">暂无任务</div>';
      return;
    }
    el.innerHTML = d.tasks.map(t =>
      `<div class="task-item" onclick="showTask('${t.task_id}')">${escapeHtml((t.concept||'').slice(0,18))}
        <span class="t-status st-${t.status}">${t.status}</span></div>`
    ).join('');
  } catch (e) {}
}

function showTask(taskId) {
  fetch(`/api/tasks/${taskId}`).then(r => r.json()).then(t => {
    if (t.status === 'completed') {
      addVideoCard(t);
    } else {
      addTaskCard(t);
      startPolling(t.task_id);
    }
    setLogTask(taskId);
    $('#sidebar').classList.remove('open');
    scrollBottom();
  });
}

function playTask(taskId) {
  fetch(`/api/tasks/${taskId}`).then(r => r.json()).then(t => {
    addVideoCard(t); scrollBottom();
  });
}
function watchTask(taskId) {
  fetch(`/api/tasks/${taskId}`).then(r => r.json()).then(t => {
    addTaskCard(t); startPolling(taskId); scrollBottom();
  });
}

/* ── 消息渲染 ── */
function addUser(text) {
  hideEmpty(); pushChat({ r: 0, t: text });
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messages.appendChild(div);
  scrollBottom();
}
function addBot(html) {
  hideEmpty(); pushChat({ r: 1, h: html });
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = html;
  messages.appendChild(div);
  scrollBottom();
  return div;
}
let chats = [], curId = null;
try { chats = JSON.parse(localStorage.getItem('vidance_chats') || '[]') } catch (e) { chats = [] }
function saveChats() {
  localStorage.setItem('vidance_chats', JSON.stringify(chats.slice(0, 30)));
  localStorage.setItem('vidance_chat_cur', curId || '');
  renderChatSide();
}
function renderChatSide() {
  const el = document.getElementById('chat-list');
  const t = document.getElementById('session-title');
  const c = curChat(); if (t) t.textContent = (c && c.title) || '新会话';
  if (!el) return;
  Promise.all([
    fetch('/api/tasks?limit=12').then(r => r.json()).catch(() => ({})),
    fetch('/api/agents/records?limit=40').then(r => r.json()).catch(() => ({})),
  ]).then(([dt, dr]) => {
    const items = chats.map(x => ({ k: 'c', id: x.id, ts: x.ts, st: '',
      title: x.title || '（空会话）', meta: x.msgs.length + ' 条', cur: x.id === curId }));
    const seen = new Set(chats.map(x => x.id));
    for (const t2 of (dt.tasks || [])) {
      if (seen.has(t2.task_id)) continue; seen.add(t2.task_id);
      items.push({ k: 't', id: t2.task_id, st: t2.status,
        ts: +new Date(String(t2.created_at || '').replace(' ', 'T')) || 0,
        title: (t2.concept || t2.task_id).slice(0, 18), meta: t2.status });
    }
    for (const rc of (dr.records || [])) {
      if (seen.has(rc.task_id)) continue; seen.add(rc.task_id);
      items.push({ k: 'a', id: rc.task_id, st: rc.status, ts: rc.ts,
        title: (rc.title || rc.task_id).replace(/^.*?[▶✗]\s*/, '').slice(0, 24), meta: rc.status });
    }
    items.sort((x, y) => y.ts - x.ts);
    const go = { c: (i) => `loadSession('${i}')`, t: (i) => `showTask('${i}')`, a: (i) => `showAgent('${i}')` };
    const ico = { c: (x) => (x.cur ? '● ' : ''), t: () => '🎬 ', a: () => '⚙ ' };
    el.innerHTML = items.map(x =>
      `<div class="task-item" style="display:flex;align-items:center;gap:4px" onclick="${go[x.k](x.id)}">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ico[x.k](x)}${escapeHtml(x.title)}</span>
        <span class="${x.k !== 'c' ? 't-status st-' + x.st : ''}" style="font-size:10px;color:var(--fg-dim)">${x.meta}</span>
        <span style="color:var(--fg-dim);padding:0 4px;cursor:pointer" title="删除记录" onclick="event.stopPropagation();${x.k === 'c' ? `delSession('${x.id}')` : `delTask('${x.id}')`}">✕</span>
      </div>`).join('') || '<div style="color:var(--fg-dim);font-size:12px">暂无历史</div>';
  });
}
function showAgent(id) {
  setLogTask(id);
  fetch('/api/agents/records?limit=200').then(r => r.json()).then(d => {
    const rc = (d.records || []).find(x => x.task_id === id);
    if (rc && rc.final) {
      addBot('<video class="vuni" controls preload="metadata" src="/api/file?path='
        + encodeURIComponent(rc.final) + '"></video>'
        + '<div class="args">' + escapeHtml(id) + ' · ' + escapeHtml(rc.final.split('/').slice(-2).join('/')) + '</div>');
      renderChat();
    }
  });
  $('#log-panel').classList.add('open');
  startLogPoll();
}
function clearChats() {
  if (!confirm('清空浏览器里的全部会话记录？（output 里的运行记录不受影响）')) return;
  ['vidance_chats', 'vidance_chat', 'vidance_chat_cur'].forEach(k => localStorage.removeItem(k));
  chats = []; mkChat(); renderChat();
}
function delTask(id) {
  if (!confirm('删除该任务记录及其 output 目录？')) return;
  fetch('/api/tasks/' + id, { method: 'DELETE' }).then(r => {
    if (!r.ok) return r.json().then(j => { alert('删除失败: ' + (j.detail || r.status)); });
  }).finally(() => renderChatSide());
}
function delSession(id) {
  chats = chats.filter(c => c.id !== id);
  if (curId === id) { curId = chats[0] ? chats[0].id : null; if (!curId) mkChat(); }
  saveChats(); renderChat();
}
function curChat() { return chats.find(c => c.id === curId); }
function mkChat(title) {
  const c = { id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
              ts: Date.now(), title: title || '', msgs: [] };
  chats.unshift(c); if (chats.length > 30) chats.pop(); curId = c.id; saveChats();
  return c;
}
function newChat() { mkChat(); renderChat(); }
function pushChat(m) {
  let c = curChat();
  if (!c) c = mkChat();
  c.msgs.push(m); if (c.msgs.length > 200) c.msgs.splice(0, c.msgs.length - 200);
  if (m.r === 0 && !c.title) c.title = String(m.t).slice(0, 10);
  saveChats();
}
function renderChat() {
  messages.innerHTML = '';
  renderChatSide();
  const c = curChat(); if (!c) return;
  for (const m of c.msgs) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.r ? 'bot' : 'user');
    if (m.r) div.innerHTML = m.h; else div.textContent = m.t;
    messages.appendChild(div);
  }
  scrollBottom();
}
function migrateChat() {
  let oldm = []; try { oldm = JSON.parse(localStorage.getItem('vidance_chat') || '[]') } catch (e) {}
  if (oldm.length) {
    const c = { id: 's-migrated', ts: Date.now(), title: ((oldm.find(m => !m.r) || {}).t || '历史会话').slice(0, 24), msgs: oldm };
    if (!chats.some(x => x.id === c.id)) chats.push(c);
    localStorage.removeItem('vidance_chat'); saveChats();
  }
  curId = localStorage.getItem('vidance_chat_cur') || (chats[0] && chats[0].id) || null;
  if (!curId || !chats.some(c => c.id === curId)) { mkChat(); }
}
function showSessions() {
  const pop = $('#sess-pop');
  $('#sess-list').innerHTML = chats.map(c =>
    `<div style="display:flex;align-items:center;border-bottom:1px solid var(--border)">
      <div style="flex:1;padding:8px;cursor:pointer" onclick="loadSession('${c.id}')">
        <div style="font-size:12.5px">${escapeHtml(c.title || '（空会话）')}${c.id === curId ? ' <span style="color:var(--accent)">●</span>' : ''}</div>
        <div style="font-size:11px;color:var(--fg-dim);margin-top:2px">${new Date(c.ts).toLocaleString()} · ${c.msgs.length} 条</div>
      </div>
      <span style="color:var(--fg-dim);padding:0 10px;cursor:pointer" onclick="event.stopPropagation();delSession('${c.id}')">✕</span>
    </div>`).join('') || '<div style="padding:12px;color:var(--fg-dim);font-size:12px">暂无会话</div>';
  pop.style.display = pop.style.display === 'none' ? 'block' : 'none';
}
function loadSession(id) { curId = id; saveChats(); renderChat(); $('#sess-pop').style.display = 'none'; }
function hideEmpty() { const e = $('#empty-hint'); if (e) e.remove(); }
function scrollBottom() { messages.scrollTop = messages.scrollHeight; }
function escapeHtml(s) {
  return (s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}

/* ── 卡片 ── */
function addTaskCard(t) {
  hideEmpty();
  addTaskTab(t.task_id, t.concept || t.task_id);
  if (document.getElementById('card-' + t.task_id)) return updateTaskCard(t);
  const div = document.createElement('div');
  div.className = 'card'; div.id = 'card-' + t.task_id;
  const chain = t.options && t.options.mode === 'chain';
  div.innerHTML = `
    <h4><span class="pill ${t.status}" id="pill-${t.task_id}">${t.status}</span> ${chain ? 'Agent 链' : '生成中'}</h4>
    <div class="concept">${escapeHtml(t.concept)}</div>
    <div class="progress-bar"><div id="bar-${t.task_id}"></div></div>
    <div class="meta" id="meta-${t.task_id}">阶段: ${t.stage || 'queued'}</div>
    ${chain ? '<div id="trace-' + t.task_id + '" style="margin-top:8px"></div>' : ''}`;
  messages.appendChild(div);
  scrollBottom();
  if (chain) refreshTrace(t.task_id);
}

function updateTaskCard(t) {
  const pill = document.getElementById('pill-' + t.task_id);
  const bar = document.getElementById('bar-' + t.task_id);
  const meta = document.getElementById('meta-' + t.task_id);
  if (pill) { pill.textContent = t.status; pill.className = 'pill ' + t.status; }
  updateTabDot(t.task_id, t.status);
  if (bar) bar.style.width = Math.round((t.progress || 0) * 100) + '%';
  if (meta) {
    let el = '';
    if (t.started_at && t.status === 'running')
      el = ' · ' + Math.max(0, Math.round((Date.now() - new Date(t.started_at)) / 1000)) + 's';
    meta.textContent = '阶段: ' + (t.stage || t.status) + el + (t.error ? ' | 错误: ' + t.error : '');
  }
  if (document.getElementById('trace-' + t.task_id) || (t.options && t.options.mode === 'chain')) {
    const wrap = document.getElementById('card-' + t.task_id);
    if (wrap && !document.getElementById('trace-' + t.task_id))
      wrap.insertAdjacentHTML('beforeend', '<div id="trace-' + t.task_id + '" style="margin-top:8px"></div>');
    refreshTrace(t.task_id);
  }
  if ((t.status === 'completed' || t.status === 'failed') && pollers[t.task_id]) {
    clearInterval(pollers[t.task_id]); delete pollers[t.task_id];
    if (t.status === 'completed') addVideoCard(t);
    else addBot(`<b>✗ 任务失败</b> ${escapeHtml(t.task_id)}：${escapeHtml(t.error||'')}`);
  }
}

function addVideoCard(t) {
  hideEmpty();
  if (document.getElementById('card-' + t.task_id)) {
    const card = document.getElementById('card-' + t.task_id);
    const pill = document.getElementById('pill-' + t.task_id);
    if (pill) { pill.textContent = 'completed'; pill.className = 'pill completed'; }
    if (!card.querySelector('video')) {
      card.querySelector('.progress-bar').style.display = 'none';
      card.insertAdjacentHTML('beforeend',
        `<video controls preload="metadata" src="/api/video/${t.task_id}"></video>`);
    }
    return;
  }
  const div = document.createElement('div');
  div.className = 'card'; div.id = 'card-' + t.task_id;
  div.innerHTML = `
    <h4><span class="pill completed">completed</span> 成片</h4>
    <div class="concept">${escapeHtml(t.concept)}</div>
    <video controls preload="metadata" src="/api/video/${t.task_id}"></video>`;
  messages.appendChild(div);
  scrollBottom();
}

/* ── 架构图 / agent / chain trace ── */
const ARCH_COLORS = { core:'#8b7cf6', director:'#f6a35c', generator:'#5cc8f6',
                      post:'#63e6a6', audit:'#f66c8b', common:'#9aa0b4' };
function renderArch(d) {
  const cards = (d.layers || []).map(L => {
    const c = ARCH_COLORS[L.layer] || '#888';
    const ags = (L.agents || []).map(a => {
      const ins = Array.isArray(a.inputs) ? a.inputs.join(', ') : String(a.inputs || '');
      return `<span class="ag" title="${escapeHtml(ins)}｜${escapeHtml(a.desc||'')}">${escapeHtml(a.name)}${a.gpu?' ⚡':''}</span>`;
    }).join('');
    const tls = (L.tools || []).map(t => `<span class="tl">${escapeHtml(t)}</span>`).join('');
    return `<div class="arch-L" style="border-color:${c}">
      <div class="arch-h" style="color:${c}">${escapeHtml(L.title)}<span class="arch-p">${escapeHtml(L.path)}</span></div>
      <div class="arch-n">${escapeHtml(L.note)}</div>
      ${ags ? '<div>' + ags + '</div>' : ''}
      ${tls ? '<div class="arch-t">' + tls + '</div>' : ''}
    </div>`;
  }).join('');
  const svcs = (d.services || []).map(s =>
    `<span class="svc ${s.online?'on':'off'}" title="${escapeHtml(s.for||'')}">` +
    `<i></i>${escapeHtml(s.name)} :${s.port}${s.gpu && s.gpu!=='—' && s.gpu!=='CPU' ? '·'+s.gpu : ''}</span>`).join('');
  return `<b>🧭 ${escapeHtml(d.message)}</b>
    <div class="arch-flow">${escapeHtml(d.flow||'')}</div>
    <div class="arch-svcs">${svcs}</div>
    <div class="arch-grid">${cards}</div>
    <div class="arch-note">运行台账：${escapeHtml(d.board||'')}</div>
    <div class="arch-note">入口：${escapeHtml(d.entry||'')}</div>`;
}
function renderAgent(d) {
  if (d.board) {
    const rows = (d.runs || []).map(s => {
      const t = new Date((s.t_start || 0) * 1000);
      const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0');
      return `<div class="trace-row"><span class="trace-dur">${hh}</span>` +
        `<span class="trace-badge" style="color:${ARCH_COLORS[s.layer]||'#888'}">${escapeHtml(s.layer)}</span>` +
        `<span class="trace-agg ${s.ok?'ok':'err'}">${s.ok?'✓':'✗'} ${escapeHtml(s.agent)}</span>` +
        (s.score != null ? `<span class="trace-score">${s.score}</span>` : '') +
        `<span class="trace-dur" style="margin-left:0;color:var(--fg-dim)">${escapeHtml(String(s.task_id||''))}</span>` +
        `<span class="trace-dur">${(s.t_dur||0).toFixed(1)}s</span></div>`;
    }).join('');
    return `<b>📖 ${escapeHtml(d.message)}</b>` + (rows || '<div class="trace-dur">暂无记录</div>');
  }
  if (d.agents) {
    const rows = d.agents.map(a =>
      `<div class="trace-row"><span class="trace-badge" style="color:${ARCH_COLORS[a.layer]}">${a.layer}</span>` +
      `<span class="trace-agg">${escapeHtml(a.name)}</span><span>${escapeHtml(a.desc||'')}</span>` +
      `<span class="trace-dur">${a.gpu?'⚡ GPU':''}</span></div>`).join('');
    return `<b>${escapeHtml(d.message)}</b>${rows}`;
  }
  if (d.steps) {
    const rows = traceRows(d.steps.map(s => ({
      agent: s.agent, layer: s.layer, ok: s.ok, score: s.score,
      t_dur: s.t_dur, error: s.error })));
    const head = `<b>${d.ok ? '✓' : '✗'} ${escapeHtml(d.message || '')}</b>`;
    const vid = d.ctx && d.ctx.video ? `<video class="vuni" controls preload="metadata" src="/api/file?path=${encodeURIComponent(d.ctx.video)}"></video>` : '';
    return head + rows + vid;
  }
  const ok = d.ok !== false;
  const arts = Object.entries(d.artifacts || {}).map(([k, v]) =>
    `<span class="tl">${escapeHtml(k)}=${escapeHtml(String(v))}</span>`).join(' ');
  const vid = d.artifacts && d.artifacts.video
    ? `<video class="vuni" controls preload="metadata" src="/api/file?path=${encodeURIComponent(d.artifacts.video)}"></video>` : '';
  return `<b>${ok ? '✓' : '✗'} ${escapeHtml(d.message || '')}</b> ` +
         `<span class="trace-dur">${(d.t_dur||0).toFixed(1)}s</span>` +
         (arts ? '<div style="margin-top:6px">' + arts + '</div>' : '') +
         (d.error ? '<div class="trace-err">' + escapeHtml(d.error) + '</div>' : '') + vid;
}
function traceRows(runs) {
  return runs.map((s, i) =>
    `<div class="trace-row"><span class="trace-badge">#${i+1} ${(s.layer||'').toUpperCase()}</span>` +
    `<span class="trace-agg ${s.ok?'ok':'err'}">${s.ok?'✓':'✗'} ${escapeHtml(s.agent)}</span>` +
    (s.score != null ? `<span class="trace-score">${s.score}</span>` : '') +
    (s.error ? `<span class="trace-err">${escapeHtml(String(s.error).slice(0,120))}</span>` : '') +
    `<span class="trace-dur">${(s.t_dur||0).toFixed(1)}s</span></div>`).join('');
}
async function refreshTrace(taskId) {
  const el = document.getElementById('trace-' + taskId);
  if (!el) return;
  try {
    const d = await (await fetch(`/api/tasks/${taskId}/trace`)).json();
    const runs = (d.runs || []).slice().reverse();
    el.innerHTML = runs.length ? traceRows(runs)
      : '<div class="trace-dur">等待首个 Agent 完成…</div>';
  } catch (e) { /* 静默 */ }
}

function quickHelp(cmd) {

}

function addComposeCard(output, videoUrl) {

function startPolling(taskId) {
  if (pollers[taskId]) return;
  pollers[taskId] = setInterval(async () => {
    try {
      const r = await fetch(`/api/tasks/${taskId}`);
      if (r.status === 404) { clearInterval(pollers[taskId]); delete pollers[taskId]; return; }
      const t = await r.json();
      if (document.getElementById('card-' + taskId)) updateTaskCard(t);
      else addTaskCard(t);
    } catch (e) {}
  }, pollInterval);
}

/* ── 发送 ── */

/* ── /agent 流水线打字机（SSE） ── */
function conceptOf(s) {
  const m = s.match(/"(?:concept|prompt)"\s*:\s*"([^"]+)"/);
  if (m) return m[1];
  return s.replace(/[{}"]/g, '').replace(/^\/?agent\s+(run|chain)\s*/, '').trim();
}

async function streamAgent(argstr) {
  // 一个命令一个对话：不再另开新会话，命令/进度/成片都在当前对话里积累
  const cc = curChat();
  if (cc) { cc.title = conceptOf(argstr).slice(0, 10) || cc.title; saveChats(); }
  renderChat();
  const bub = addBot('<div class="stream-log"><div class="live"><span class="spin"></span><span class="live-t">⌁ 连接中…</span></div></div>');
  const log = bub.querySelector('.stream-log');
  const liveT = bub.querySelector('.live-t');
  const liveEl = bub.querySelector('.live');
  const lineMap = {}; let total = 0; let curTid = null;
  let curStep = null; const t0 = Date.now();
  let barEl = null; const nodeMap = {}; const ansMap = {};
  const LAY = { director: 'D', generator: 'G', post: 'P', audit: 'V', common: 'C' };
  const shortName = (n) => { const [ly, ag] = String(n).split('.'); return (LAY[ly] || ly || '?') + '·' + (ag || ''); };
  const tick = setInterval(() => {
    for (const l of Object.values(lineMap))
      if (l.t0 && l.t1 == null) l.el.querySelector('.tm').textContent = Math.round((Date.now() - l.t0) / 1000) + 's…';
    if (curStep && liveT && liveEl.isConnected)
      liveT.textContent = '[' + curStep.i + '/' + total + '] ' + curStep.name + ' · ' + Math.round((Date.now() - t0) / 1000) + 's';
  }, 1000);
  const endLive = (html) => { if (liveEl && liveEl.isConnected) { liveEl.classList.remove('live'); liveEl.innerHTML = html; } };
  const done = () => { clearInterval(tick); const c = curChat(); if (c && c.msgs.length) { c.msgs[c.msgs.length - 1].h = bub.innerHTML; saveChats(); } };
  const line = (html) => { const d = document.createElement('div'); d.innerHTML = html; log.appendChild(d); scrollBottom(); return d; };
  function handle(e) {
    if (e.event === 'task') { curTid = e.task_id; setLogTask(e.task_id); }
    else if (e.event === 'start') {
      total = e.total;
      barEl = document.createElement('div'); barEl.className = 'pipe-bar';
      log.appendChild(barEl);
      line('▶ 流水线启动 · ' + e.total + ' 步');
    }
    else if (e.event === 'step') {
      curStep = { i: e.i + 1, name: e.name };
      if (barEl) {
        const n = document.createElement('span');
        const ly = String(e.name).split('.')[0];
        const LAYC = { director: 'd0', generator: 'd1', post: 'd2', audit: 'd3', common: 'd4' };
        n.className = 'pnode run ' + (LAYC[ly] || 'd4');
        n.innerHTML = escapeHtml(shortName(e.name));
        barEl.appendChild(n);
        nodeMap[e.i] = n;
      }
      const d = line('⏳ [' + (e.i + 1) + '/' + total + '] <b>' + escapeHtml(e.name) + '</b>'
        + '<span class="args">' + escapeHtml(e.args || '') + '</span><span class="tm"></span>');
      lineMap[e.i] = { el: d, t0: Date.now() };
    } else if (e.event === 'chunk') {
      let ab = ansMap[e.i];
      if (!ab) {
        const row = line('<div class="ans"><details open><summary>▸ LLM 回答</summary><div class="ans-b"></div></details></div>');
        ab = { el: row.querySelector('.ans-b'), txt: '' };
        ansMap[e.i] = ab;
      }
      ab.txt += e.delta;
      ab.el.textContent = ab.txt;
      scrollBottom();
    } else if (e.event === 'done') {
      const l = lineMap[e.i]; if (!l) return; l.t1 = Date.now();
      const n = nodeMap[e.i];
      if (n) { n.className = 'pnode ' + (e.ok ? 'ok' : 'fail');
        n.innerHTML = (e.ok ? '✓ ' : '✗ ') + escapeHtml(shortName(e.name)) + ' ' + e.secs + 's'; }
      const art = Object.values(e.arts || {})[0];
      l.el.innerHTML = (e.ok ? '<span style="color:var(--ok)">✓</span> ' : '<span style="color:#e5534b">✗</span> ')
        + '[' + (e.i + 1) + '/' + total + '] <b>' + escapeHtml(e.name) + '</b> ' + e.secs + 's'
        + (e.ok && art ? '<span class="args">' + escapeHtml(String(art).split('/').pop()) + '</span>' : '')
        + (e.error ? '<span class="args">' + escapeHtml(e.name + ': ' + String(e.error).slice(0, 120)) + '</span>' : '');
    } else if (e.event === 'final') {
      endLive((e.ok ? '<span style="color:var(--ok)">■ 链完成</span>' : '<span style="color:#e5534b">■ 链中断</span>')
        + ' · ' + e.secs + 's · <span class="args">台账 ' + escapeHtml(e.task_id) + '</span>');
      if (e.final && /\.(mp4|mov|webm)$/i.test(e.final))
        line('<video class="vuni" controls preload="metadata" src="/api/file?path=' + encodeURIComponent(e.final) + '"></video>'
          + '<div class="args">' + escapeHtml(String(e.final).replace(/\//g, '/').split('/').slice(-2).join('/')) + '</div>');
      else if (e.final) line('<span class="args">产物: ' + escapeHtml(String(e.final).split('/').pop()) + '</span>');
    } else if (e.event === 'error') {
      endLive('<span style="color:#e5534b">✗ ' + escapeHtml(e.msg) + '</span>');
    }
  }
  try {
    const resp = await fetch('/api/agent/stream', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: '/agent ' + argstr }) });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      endLive('<span style="color:#e5534b">✗ ' + escapeHtml(e.detail || resp.status) + '</span>');
      done(); return;
    }
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done: fin } = await reader.read(); if (fin) break;
      buf += dec.decode(value, { stream: true });
      let ix;
      while ((ix = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, ix); buf = buf.slice(ix + 2);
        for (const ln of chunk.split('\n')) {
          if (!ln.startsWith('data:')) continue;
          try { handle(JSON.parse(ln.slice(5).trim())); } catch (err) {}
        }
      }
    }
  } catch (err) {
    endLive('<span style="color:#e5534b">✗ 连接中断</span>');
    line('<span style="color:#e5534b">✗ 连接中断: ' + escapeHtml(String(err)) + '</span>');
    if (curTid) { line('<span class="args">api 重启/断流会终止后台执行。台账 ' + curTid + '，📋 可查已落盘日志；重启后重发本条即可</span>'); }
  }
  done();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto'; hideSlash();
  addUser(text);
  setSending(true);

  try {
    if (text.startsWith('/')) {
      await dispatchSlash(text);
    } else {
      await sendNatural(text);
    }
  } catch (e) {
    addBot('<b>✗ 请求失败</b> ' + escapeHtml(String(e)));
  }
  setSending(false);
  refreshTasks();
}

function setSending(b) { $('#btn-send').disabled = b; }

/* / 命令分发 */
async function dispatchSlash(text) {
  const m = text.match(/^\/(\w+)\s*([\s\S]*)$/);
  if (!m) { addBot('命令格式：/名称 参数，输入 / 查看全部'); return; }
  const [, name, rest] = m;
  if (name === 'agent' && /^(chain|run)\b/.test(rest) && /[{[]/.test(rest)) {
    await streamAgent(rest); return;
  }
  const r = await fetch(`/api/tool/${name}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ args: rest }),
  });
  const d = await r.json();
  if (!r.ok) { addBot('<b>✗ ' + escapeHtml(d.detail || r.status) + '</b>'); return; }

  // v13 arch 架构图 / agent 注册表+运行
  if (name === 'arch') { addBot(renderArch(d)); return; }
  if (name === 'agent') { addBot(renderAgent(d)); return; }

  // 任务型：auto/fast/hot
  if (d.task_id) {
    addBot(`<b>✓ 已提交</b> ${escapeHtml(d.message)}`);
    const t = await (await fetch(`/api/tasks/${d.task_id}`)).json();
    addTaskCard(t);
    startPolling(d.task_id);
    setLogTask(d.task_id);   // 日志面板自动跟踪新任务
    return;
  }
  // v6 dialog
  if (d.dialog) {
    activeDialog = d.dialog;
    renderDialog(d.dialog, rest);
    return;
  }
  // scout
  if (d.candidates) {
    const rows = d.candidates.map(c =>
      `<div class="cand"><span class="score">${c.predicted_score ?? '-'}</span>
        <span>${escapeHtml(c.concept)}</span></div>`).join('');
    addBot(`<b>${escapeHtml(d.message)}</b>${rows}`);
    return;
  }
  // voices
  if (d.voices) {
    addBot(`<b>${escapeHtml(d.message)}</b>\n` + d.voices.map(v =>
      `• ${escapeHtml(v.name || v)} ${v.desc ? '— ' + escapeHtml(v.desc) : ''}`).join('\n'));
    return;
  }
  // status：单个任务详情（文字展示，不做卡片/轮询）
  if (name === 'status' && d.task) {
    const t = d.task;
    const rows = [
      ['概念', t.concept],
      ['状态', t.status],
      ['阶段', t.stage],
      ['进度', Math.round((t.progress || 0) * 100) + '%'],
      ['创建', t.created_at],
      ['完成', t.completed_at || '-'],
      ['输出', t.output || '-'],
      ['错误', t.error || '-'],
    ].map(([k, v]) => `<div class="kv"><span class="k">${k}</span><span>${escapeHtml(String(v))}</span></div>`).join('');
    addBot(`<b>任务 ${escapeHtml(t.task_id)}</b>${rows}`
      + (t.status === 'completed' ? `<br><button class="chip-btn" onclick="playTask('${t.task_id}')">→ 播放成片</button>` : '')
      + (t.status === 'running' || t.status === 'queued' ? `<br><button class="chip-btn" onclick="watchTask('${t.task_id}')">→ 跟踪进度</button>` : ''));
    return;
  }
  // video tool
  if (d.task) {
    if (d.task.status === 'completed') addVideoCard(d.task);
    else { addTaskCard(d.task); startPolling(d.task.task_id); }
    return;
  }
  // luts / moods 枚举
  if (d.luts) {
    addBot(`<b>${escapeHtml(d.message)}</b>\n` + d.luts.map(l => `• ${escapeHtml(l)}`).join('\n'));
    return;
  }
  if (d.moods) {
    addBot(`<b>${escapeHtml(d.message)}</b>\n` + d.moods.map(x => `• ${escapeHtml(x)}`).join('\n'));
    return;
  }
  // tasks 列表
  if (d.tasks) {
    const rows = d.tasks.map(t =>
      `<div class="cand"><span class="st-${t.status}">${t.status}</span> ` +
      `<span>${escapeHtml((t.concept||'').slice(0,30))}</span> <code>${t.task_id}</code></div>`).join('');
    addBot(`<b>${escapeHtml(d.message)}</b>${rows}`);
    return;
  }
  // trends 热榜
  if (d.topics) {
    const rows = d.topics.map((t,i) =>
      `<div class="cand"><span class="score">${i+1}</span> ` +
      `<span>${escapeHtml((t.title||'').slice(0,50))}</span> ` +
      `<span class="d" style="float:right">${escapeHtml(t.source||'')}</span></div>`).join('');
    addBot(`<b>${escapeHtml(d.message)}</b>${rows}`);
    return;
  }
  // h3shot / custom / svg 异步（svg 有实时日志可跟踪；h3 约 15-20 分钟/镜）
  if (d.h3_job_id) {
    addBot(`<b>✓ ${escapeHtml(d.message || 'H3 任务已提交')}</b> 轮询 ${escapeHtml(d.poll)}`);
    if (/^svg_/.test(d.h3_job_id)) setLogTask(d.h3_job_id);
    pollH3(d.h3_job_id);
    return;
  }
  if (d.job_id && d.poll) {  // clip 异步
    addBot(`<b>✓ ${escapeHtml(d.message)}</b> 轮询 ${escapeHtml(d.poll)}`);
    pollClip(d.job_id);
    return;
  }  // compose：直接出成片卡片
  if (d.compose_output) {
    addBot(`<b>✓ ${escapeHtml(d.message || '成片已生成')}</b>`);
    addComposeCard(d.compose_output, d.video_url);
    return;
  }
  // help 详情：/help 命令名
  if (name === 'help' && d.command && d.help_lines) {
    const c = d.command;
    const params = (c.params || []).map(p_ => {
      const req = p_.required ? ' <span class="req">必填</span>' : '';
      const ch = p_.choices ? ` <span class="ch">[${p_.choices.join('/')}]</span>` : '';
      return `<div class="ins-line"><code>${escapeHtml(p_.key)}</code> ${escapeHtml(p_.desc||'')}${req}${ch}</div>`;
    }).join('');
    const exs = (c.examples || []).map(e =>
      `<div class="ins-line">${escapeHtml(e)}</div>`).join('');
    addBot(`<b>/${escapeHtml(c.name)}</b> <span class="ver">${escapeHtml(c.version||'')}</span> — ${escapeHtml(c.brief)}`
      + `<div class="ins-lib"><div class="ins-line">${escapeHtml(c.detail||'')}</div>`
      + (params ? `<div class="ins-sec">参数</div>${params}` : '')
      + (exs ? `<div class="ins-sec">示例</div>${exs}` : '')
      + `</div>`);
    return;
  }
  // help 概览：/help
  if (name === 'help' && d.help_lines) {
    const lines = d.help_lines.map(l => {
      const m = l.match(/^\/(\w+)\s+—\s+([\s\S]*)$/);
      if (m) {
        return `<div class="ins-line cmd-row" onclick="quickHelp('${m[1]}')">`
          + `<code>/${m[1]}</code> <span class="cmd-brief">${escapeHtml(m[2])}</span></div>`;
      }
      return `<div class="ins-line">${escapeHtml(l)}</div>`;
    }).join('');
    const eff = (d.effects_index || []).length
      ? `<div class="ins-sec">v10 剪辑效果分类（/compose，详见 /help compose）</div>`
        + d.effects_index.map(l => `<div class="ins-line">${escapeHtml(l)}</div>`).join('')
      : '';
    const hint = d.help_hint ? `<div class="ins-hint">${escapeHtml(d.help_hint)}</div>` : '';
    addBot(`<b>${escapeHtml(d.message || '命令一览')}</b>${hint}`
      + `<div class="ins-lib">${lines}${eff}</div>`);
    return;
  }
  if (d.message) addBot('<b>' + escapeHtml(d.message) + '</b>');
}

function pollClip(jobId) {
  const iv = setInterval(async () => {
    const d = await (await fetch(`/api/clip/${jobId}`)).json();
    if (d.status === 'completed') {
      clearInterval(iv);
      addBot(`<b>✓ 裁剪完成</b>\n输出: ${escapeHtml(d.output)}\n保留 ${d.keep ? d.keep.length : 0} 段 / 共 ${d.segments ? d.segments.length : 0} 段`);
    } else if (d.status === 'failed') {
      clearInterval(iv);
      addBot('<b>✗ 裁剪失败</b> ' + escapeHtml(d.error || ''));
    }
  }, 3000);
}

/* H3 单镜 / custom 异步轮询（长耗时，60s 一次） */
function pollH3(jobId) {
  const isSvg = /^svg_/.test(jobId);
  const isEdit = /^edit_/.test(jobId);
  const isVace = /^vace_/.test(jobId);
  const hint = isEdit ? '编辑中，通常 1-2 分钟，agent 日志见左侧面板…'
    : isVace ? 'VACE 视频生成中，约 5-10 分钟，可离开页面稍后回来…'
    : isSvg ? 'LLM 生成中…' : 'H3 生成中，通常 15-20 分钟，可离开页面稍后回来…';
  addBot('<div class="stream-log" id="jl-' + jobId + '">' +
    '<div class="live"><span class="spin"></span><span class="live-t">⌁ ' + hint +
    '</span></div></div>');
  if (isSvg || isEdit || isVace) setLogTask(jobId);
  const root = document.getElementById('jl-' + jobId);
  const liveEl = root.querySelector('.live');
  const t0 = Date.now();
  const iv = setInterval(async () => {
    let d;
    try { d = await (await fetch(`/api/h3shot/${jobId}`)).json(); } catch (e) { return; }
    if (d.status === 'running') {
      if (!liveEl || !liveEl.isConnected) return;
      const st = d.stage ? d.stage + ' · ' : '';
      const fr = d.frames ? ' · 帧 ' + d.frames : '';
      let html = '<span class="spin"></span><span class="live-t">' +
        escapeHtml(st + Math.round((Date.now() - t0) / 1000) + 's' + fr) + '</span>';
      if (d.llm_text) {
        const prev = liveEl.querySelector('details');
        const open = prev ? (prev.open ? ' open' : '') : ' open';
        html += '<div class="ans"><details' + open + '><summary>▸ LLM 输出</summary>' +
          '<div class="llmt">' + escapeHtml(d.llm_text) + '</div></details></div>';
      }
      liveEl.innerHTML = html;
      scrollBottom();
      return;
    }
    clearInterval(iv);
    const secs = Math.round((Date.now() - t0) / 1000);
    if (liveEl && liveEl.isConnected) {
      liveEl.classList.remove('live');
      liveEl.innerHTML = d.status === 'completed'
        ? '<b>✓ 生成完成（' + secs + 's）</b>'
        : '<b>✗ 生成失败</b> ' + escapeHtml(d.error || '');
    }
    if (d.status === 'completed') {
      addBot(`输出: ${escapeHtml(d.output || '')}` + (d.seed ? `\nseed: ${d.seed}` : ''));
      if (d.video_url) addComposeCard(d.output, d.video_url);
      else if (d.image_url) addBot(`<img class="img-prev" src="${escapeHtml(d.image_url)}" alt="编辑结果">`);
    }
  }, isSvg ? 3000 : 5000);
}

/* t2c：把增强概念/详细需求翻译成 Vidance 命令 */
async function t2cTranslate(text) {
  const t = (text || lastConcept || '').trim();
  if (!t) { addBot('没有可翻译的内容'); return; }
  addBot('<i>正在翻译为命令…</i>');
  const last = messages.querySelectorAll('.msg.bot');
  last[last.length - 1].remove();
  const r = await fetch('/api/t2c', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: t }),
  });
  const d = await r.json();
  if (!d.command) { addBot('<b>✗ 翻译失败</b> ' + escapeHtml(d.error || '模型无输出')); return; }
  // 把 `python core/vidance.py xxx` 转成斜杠命令展示
  const slash = d.command.replace(/^python\s+core\/vidance\.py\s+/, '/');
  addBot(`<b>✓ 建议命令</b>\n<code class="t2c-cmd">${escapeHtml(slash)}</code>`
    + `<div class="t2c-src">源: ${escapeHtml(t)}</div>`
    + `<br><button class="chip-btn" onclick="runT2CCmd(${JSON.stringify(slash).replace(/"/g,'&quot;')})">▶ 执行</button>`);
}

function useConcept(mode) {
  // 取最近一次增强概念
  const bots = messages.querySelectorAll('.msg.bot');
  const last = bots[bots.length - 1];
  const concept = (last.textContent.match(/增强概念：\n([\s\S]*?)(?:→|$)/) || [])[1] || '';
  input.value = `/${mode} ${concept.trim()}`;

}

/* ── / 斜杠补全 ── */
let slashActive = false, slashIdx = 0, slashMatches = [];

input.addEventListener('input', () => {
  autoHeight();
  const v = input.value;
  if (v.startsWith('/')) showSlash(v);
  else hideSlash();
});
input.addEventListener('keydown', (e) => {
  if (slashActive && slashMatches.length) {
    if (e.key === 'ArrowDown') { slashIdx = (slashIdx + 1) % slashMatches.length; renderSlash(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { slashIdx = (slashIdx - 1 + slashMatches.length) % slashMatches.length; renderSlash(); e.preventDefault(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) { pickSlash(slashIdx); e.preventDefault(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function autoHeight() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

function showSlash(v) {
  if (!TOOLS_LOADED) return;
  const prefix = v.slice(1).split(/\s/)[0].toLowerCase();
  const hasSpace = /\s/.test(v.slice(1));
  if (hasSpace) { hideSlash(); return; }  // 已在参数区，不补全命令名
  slashMatches = TOOLS.filter(t => t.name.startsWith(prefix));
  slashIdx = 0;
  renderSlash();
}
function renderSlash() {
  if (!slashMatches.length) { hideSlash(); return; }
  pop.classList.add('show'); slashActive = true;
  pop.innerHTML = slashMatches.map((t, i) =>
    `<div class="slash-item ${i === slashIdx ? 'active' : ''}" onmouseover="slashIdx=${i};renderSlash()" onclick="pickSlash(${i})">
      <code>/${t.name}</code><span class="d">${escapeHtml(t.help)}</span></div>`).join('');
  const activeEl = pop.querySelector('.slash-item.active');
  if (activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block: 'nearest' });
}
function hideSlash() { pop.classList.remove('show'); slashActive = false; slashMatches = []; }
function pickSlash(i) {
  const t = slashMatches[i];
  if (!t) return;
  const rest = input.value.slice(1 + t.name.length);
  input.value = '/' + t.name + (rest.startsWith(' ') ? rest : ' ' + rest);
  hideSlash(); input.focus();
}

async function submitAddProvider() {

  const models = [];
  const checkboxes = $('#discovered-models').querySelectorAll('input[type=checkbox]:checked');
  if (checkboxes.length > 0) {
    for (const cb of checkboxes) {
      const mid = cb.value;
      const capSel = document.querySelector(`[data-cap="${CSS.escape(mid)}"]`);
      const cap = capSel ? capSel.value : '';
      const entry = { id: mid, capabilities: cap ? [cap] : [] };

    const manual = document.getElementById('manual-models');

      const lines = manual.value.split('\n').map(s => s.trim()).filter(Boolean);
      for (const line of lines) {
        models.push({ id: line, capabilities: [] });

  const id = 'custom-' + Date.now().toString(36);
  try {
    const r = await fetch('/api/model-providers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name, base_url: baseUrl, api_key: apiKey, models }),

    document.body.appendChild(ov);
  }
  ov.style.display = 'flex';
  const draw = async () => {
    try {
      const t = await (await fetch('/api/tasks/' + id)).json();
      updateTabDot(id, t.status);
      let tr = '';
      try {
        const td = await (await fetch(`/api/tasks/${id}/trace`)).json();
        if ((td.runs || []).length) tr = '<h4 style="margin:10px 0 4px">运行台账</h4>' + traceRows(td.runs.slice().reverse());
      } catch (e) {}
      const vid = t.status === 'completed'
        ? `<video class="vuni" controls preload="metadata" src="/api/video/${id}"></video>` : '';
      let log = '—';
      try {
        const ld = await (await fetch(`/api/tasks/${id}/log?tail=200`)).json();
        log = ld.log !== undefined ? ld.log : (ld.detail || '日志不可用');
      } catch (e) {}
      $('#ov-box').innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:center">
           <h3 style="margin:0"><span class="pill ${t.status}">${t.status}</span> ${escapeHtml((t.concept||id).slice(0,40))}</h3>
           <button class="log-x" onclick="closeTaskOverlay()">✕</button></div>
         <div class="meta" style="margin:6px 0">阶段: ${escapeHtml(t.stage||'')}　进度: ${Math.round((t.progress||0)*100)}%${t.error?'　错误: '+escapeHtml(t.error):''}</div>
         <div class="meta">${escapeHtml(id)}</div>${vid}${tr}
         <h4 style="margin:12px 0 0">详细日志</h4><pre class="ov-log" id="ov-log-pre">${escapeHtml(String(log).slice(-6000))}</pre>`;
      const pre = document.getElementById('ov-log-pre');
      if (pre && $('#log-follow') && $('#log-follow').checked) pre.scrollTop = pre.scrollHeight;
      if (['completed','failed'].includes(t.status) && ovTimer) { clearInterval(ovTimer); ovTimer = null; }
    } catch (e) {}
  };
  await draw();
  if (ovTimer) clearInterval(ovTimer);
  ovTimer = setInterval(draw, 2500);
}
function closeTaskOverlay() {
  const ov = $('#task-overlay'); if (ov) ov.style.display = 'none';
  if (ovTimer) { clearInterval(ovTimer); ovTimer = null; }
}
renderTaskTabs();

/* ── 模型提供商：连通灯 + 故障互切候选 ── */
let providerHealth = {};
async function probeProviders() {
  try {
    const d = await (await fetch('/api/model-providers/health')).json();
    providerHealth = {};
    (d.providers || []).forEach(p => providerHealth[p.id] = p);
    renderProviderList();
  } catch (e) {}
}
async function setWeight(id, w) {
  await fetch('/api/model-providers/' + id, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ weight: parseInt(w) || 0 }) });
}
async function toggleFallback(id, cur) {
  await fetch('/api/model-providers/' + id, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fallback: !cur }) });
  await refreshModalData(); probeProviders();
}
async function testChatRotate() {
  const el = $('#chat-rotate-status'); el.textContent = '测试中…';
  const d = await (await fetch('/api/model/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: [{ role: 'user', content: '回复"通"一个字' }], max_tokens: 8 })
  })).json();
  el.textContent = d.ok ? `✓ ${d.provider_name} 响应（候选链: ${d.tried.join(' → ')}）`
    : '✗ 全候选失败: ' + (d.errors || []).map(e => e.error).join(' | ').slice(0, 120);
}

async function importFromConfig(useText) {
  const st = $('#import-cfg-status'); st.textContent = '导入中…';
  const body = {};
  if (useText) {
    body.text = $('#import-cfg-text').value.trim();
    body.overwrite_llm = $('#import-overwrite-llm').checked;
    if (!body.text) { st.textContent = '请先粘贴 config 文本'; return; }
  }
  const d = await (await fetch('/api/model-providers/import', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) })).json();
  st.textContent = `导入完成：${(d.imported||[]).join(', ') || '无新提供商'}${d.llm==='overwritten'?' + 网关已覆盖':''}${(d.errors||[]).length?' 错误: '+d.errors.join('; '):''}`;
  await refreshModalData(); probeProviders();
}

migrateChat();
renderChat();
init();
