# CI 测试门禁：push/PR 时在干净环境跑全部单测（纯逻辑，无 GPU）
# 依赖集经干净 venv 验证为最小集；模型相关重依赖由测试内建跳过守卫规避：
#   - test_embed_index：模型缺失时自跳过（CI 无 /mnt/dataset，直接 exit 0）
#   - test_rag_novel：RAG 编码路径需 torch（装 CPU 版即可）
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow fastapi faiss-cpu tenacity scipy onnxruntime pyyaml requests httpx
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run test suite
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$(basename "$t")"
            if ! python "$t"; then
              echo "::error file=$t::test failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
