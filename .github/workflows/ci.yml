# CI 测试门禁：push/PR 时在干净环境跑全部单测（纯逻辑，无 GPU）
# 依赖集经干净 venv 验证为最小集；模型/编码相关测试带跳过守卫（CI 无本地模型资产）：
#   - test_embed_index / test_rag_novel：本地模型目录缺失时自跳过（exit 0）
# 失败测试的末尾 traceback 会以 ::error 注解回传（匿名可读，免登录查日志）
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg   # runner 镜像已移除 ffmpeg；rework/skills 的 ffmpeg 链测试需要

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow fastapi faiss-cpu tenacity scipy onnxruntime pyyaml requests httpx

      - name: Run test suite
        run: |
          set -o pipefail
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$(basename "$t")"
            log=$(mktemp)
            if ! python "$t" 2>&1 | tee "$log"; then
              msg=$(tail -n 25 "$log" | python -c 'import sys,urllib.parse;print(urllib.parse.quote("".join(sys.stdin.readlines())[-1800:]))')
              echo "::error file=$t::$msg"
              fail=1
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
          exit $fail
